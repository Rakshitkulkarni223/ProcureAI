services:
  - type: web
    name: procureai-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: procureai
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        value: https://procureai-frontend.onrender.com
      - key: DEMO_EMAIL
        value: demo@procureai.com
      - key: DEMO_PASSWORD
        value: Demo@123
      - key: DEMO_NAME
        value: Demo User
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false

  - type: web
    name: procureai-frontend
    env: static
    rootDir: frontend
    buildCommand: yarn install && yarn build
    staticPublishPath: build
    envVars:
      - key: NODE_VERSION
        value: 18.20.4
      - key: REACT_APP_BACKEND_URL
        value: https://procureai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
